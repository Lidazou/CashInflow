<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy.
      This is local-first software holding a user's financial history, so the
      renderer is locked down to its own bundle: no remote scripts, no inline
      script execution, no outbound connections of any kind. `connect-src 'none'`
      is what guarantees transaction data cannot be sent to a third party, even
      by a compromised dependency.
      'unsafe-inline' is permitted for STYLES only, because Vite injects style
      tags in development; scripts have no such exception.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' ws://localhost:* http://localhost:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none';"
    />
    <title>记账本 SpendWise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
